<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Selected music for advertising, film, orchestra, and multimedia performance by Yifeng Yvonne Yuan.">
  <link rel="canonical" href="${canonical_url}">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Selected Works | Yifeng Yvonne Yuan">
  <meta property="og:description" content="Original music for image, concert, and live performance.">
  <title>Selected Works | Yifeng Yvonne Yuan</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="portfolio-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="${name}'s Playground home"><span>${title}</span><span>${subtitle}</span></a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav" type="button">Menu <span aria-hidden="true">+</span></button>
    </header>
    <div class="page-layout">
      <aside class="sidebar">${navigation_html}</aside>
      <main class="portfolio-content" id="main">
        <header class="portfolio-intro">
          <p class="page-eyebrow">Composition and media</p>
          <h1>Selected Works</h1>
          <p>${portfolio_intro}</p>
          <nav class="portfolio-jump" aria-label="Jump to a selected work">${portfolio_jump_links}</nav>
        </header>
        ${portfolio_sections}
        ${footer_html}
      </main>
    </div>
  </div>
  <script src="/site.js" defer></script>
</body>
</html>
